[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "healdan"
version = "1.0.0.dev1"
description = "A local, evidence-based personal wiki with a controlled Claude Code workflow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
healdan = "healdan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healdan = ["defaults.json", "controller_formats.json"]
