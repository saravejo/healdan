name: Verify sprint pull request

on:
  workflow_dispatch:
    inputs:
      pull:
        description: Pull request number
        type: string
        required: true
      head:
        description: Full pull request head SHA
        type: string
        required: true
      base:
        description: Full main SHA for the one-time bootstrap
        type: string
        required: false
      attestation:
        description: Coordinator's evidence comment ID
        type: string
        required: true
      publish:
        description: Publish the required check after verification
        type: boolean
        default: true

permissions: {}

concurrency:
  group: sprint-b00-publisher
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'saravejo/healdan' && github.ref_protected &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/sprint-gate-bootstrap' && github.sha == vars.SPRINT_B00_BOOTSTRAP_SHA))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull: ${{ steps.scope.outputs.pull }}
      head: ${{ steps.scope.outputs.head }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate current pull request and protected base
        id: scope
        run: python3 scripts/sprint_gate.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SPRINT_PULL: ${{ inputs.pull }}
          SPRINT_HEAD: ${{ inputs.head }}
          SPRINT_BASE: ${{ inputs.base }}
          SPRINT_BOOTSTRAP_SHA: ${{ vars.SPRINT_B00_BOOTSTRAP_SHA }}

  test:
    name: sprint-b00 test
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
      - name: Install native test dependencies
        run: |
          brew install age
          npm install --global @anthropic-ai/sandbox-runtime@0.0.83
          python --version
          git --version
          age --version
          node --version
          srt --version
        shell: bash
      - name: Test exact public pull request commit
        env:
          PR: ${{ needs.prepare.outputs.pull }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          POLICY_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          git init policy
          git -C policy -c credential.helper= fetch --no-tags --depth=1 https://github.com/saravejo/healdan.git "$POLICY_SHA"
          test "$(git -C policy rev-parse FETCH_HEAD)" = "$POLICY_SHA"
          git -C policy show "$POLICY_SHA:scripts/audit_publication.py" > "$RUNNER_TEMP/audit_publication.py"
          git init candidate
          cd candidate
          git -c credential.helper= fetch --no-tags https://github.com/saravejo/healdan.git "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$HEAD_SHA"
          printf '::stop-commands::%s\n' "$(uuidgen)"
          python -I "$RUNNER_TEMP/audit_publication.py" --root "$PWD"
          candidate_home=$(mktemp -d)
          env -i PATH="$PATH" HOME="$candidate_home" bash -euo pipefail -c '
            python -I -m pip install .
            python -m unittest discover -s tests -v
            python -m unittest scripts.test_sprint_gate -v
          '

  package:
    name: sprint-b00 package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Install public build tools in the builder image
        shell: bash
        run: |
          docker build --pull --tag sprint-b00-builder - <<'DOCKERFILE'
          FROM python:3.12-slim-bookworm
          RUN python -m pip install --no-cache-dir build 'setuptools>=77' wheel
          DOCKERFILE
          docker image inspect --format '{{.Id}}' sprint-b00-builder
      - name: Build without network or host mounts, then audit locally
        env:
          PR: ${{ needs.prepare.outputs.pull }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          git init candidate
          git -C candidate -c credential.helper= fetch --no-tags https://github.com/saravejo/healdan.git "refs/pull/$PR/head"
          test "$(git -C candidate rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git -C candidate -c core.hooksPath=/dev/null checkout --detach "$HEAD_SHA"
          printf '::stop-commands::%s\n' "$(cat /proc/sys/kernel/random/uuid)"
          output=$(mktemp -d "$RUNNER_TEMP/sprint-package.XXXXXXXX")
          container=$(docker create --interactive --network none --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges --env HOME=/tmp sprint-b00-builder sh -eu -c '
              mkdir /tmp/source /tmp/dist
              tar --extract --file - --no-same-owner --no-same-permissions --directory /tmp/source
              python -I -m build --no-isolation --outdir /tmp/dist /tmp/source
            ')
          trap 'docker rm -f "$container" >/dev/null' EXIT
          if ! tar --create --file - --exclude=./.git --directory candidate . |
              docker start --attach --interactive "$container" > "$output/build.log" 2>&1; then
            echo 'The isolated package build failed.' >&2
            exit 1
          fi
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          docker cp "$container:/tmp/dist/." - > "$output/distributions.tar" 2> "$output/copy.log"
          python3 -I policy/scripts/audit_publication.py --root candidate \
            --packages "$output/distributions.tar" --require-distributions

  gate:
    name: sprint-b00 gate
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify acceptance, native CI, independent audit and Qodo
        run: python3 scripts/sprint_gate.py evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          SPRINT_PULL: ${{ needs.prepare.outputs.pull }}
          SPRINT_HEAD: ${{ needs.prepare.outputs.head }}
          SPRINT_BASE: ${{ needs.prepare.outputs.base }}
          SPRINT_ATTESTATION: ${{ inputs.attestation }}
          SPRINT_COORDINATOR_ID: ${{ vars.SPRINT_B00_COORDINATOR_ID }}
          SPRINT_QODO_BOT_ID: ${{ vars.SPRINT_B00_QODO_BOT_ID }}
          SPRINT_QODO_APP_ID: ${{ vars.SPRINT_B00_QODO_APP_ID }}
          SPRINT_BOOTSTRAP_SHA: ${{ vars.SPRINT_B00_BOOTSTRAP_SHA }}
          SPRINT_PUBLISH: ${{ inputs.publish }}
