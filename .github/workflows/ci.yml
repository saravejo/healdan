name: Verify sprint pull request

on:
  workflow_dispatch:
    inputs:
      pull:
        description: Pull request number
        type: string
        required: true
      head:
        description: Full pull request head SHA
        type: string
        required: true
      base:
        description: Full main SHA for the one-time bootstrap
        type: string
        required: false
      attestation:
        description: Coordinator's evidence comment ID
        type: string
        required: true
      publish:
        description: Publish the required check after verification
        type: boolean
        default: true

permissions: {}

concurrency:
  group: sprint-b00-publisher
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'saravejo/healdan' && github.ref_protected &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/sprint-gate-bootstrap' && github.sha == vars.SPRINT_B00_BOOTSTRAP_SHA))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull: ${{ steps.scope.outputs.pull }}
      head: ${{ steps.scope.outputs.head }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate current pull request and protected base
        id: scope
        run: python3 scripts/sprint_gate.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SPRINT_PULL: ${{ inputs.pull }}
          SPRINT_HEAD: ${{ inputs.head }}
          SPRINT_BASE: ${{ inputs.base }}
          SPRINT_BOOTSTRAP_SHA: ${{ vars.SPRINT_B00_BOOTSTRAP_SHA }}

  test:
    name: sprint-b00 test
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
      - name: Install native test dependencies
        run: |
          brew install age
          npm install --global @anthropic-ai/sandbox-runtime@0.0.83
          python --version
          git --version
          age --version
          node --version
          srt --version
        shell: bash
      - name: Test exact public pull request commit
        env:
          PR: ${{ needs.prepare.outputs.pull }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          git init candidate
          cd candidate
          git -c credential.helper= fetch --no-tags https://github.com/saravejo/healdan.git "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$HEAD_SHA"
          printf '::stop-commands::%s\n' "$(uuidgen)"
          candidate_home=$(mktemp -d)
          env -i PATH="$PATH" HOME="$candidate_home" bash -euo pipefail -c '
            python -I -m pip install .
            python -m unittest discover -s tests -v
            python -m unittest scripts.test_sprint_gate -v
            python scripts/audit_publication.py
          '

  package:
    name: sprint-b00 package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -I -m pip install build
      - name: Build and audit exact public pull request commit
        env:
          PR: ${{ needs.prepare.outputs.pull }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          git init candidate
          cd candidate
          git -c credential.helper= fetch --no-tags https://github.com/saravejo/healdan.git "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$HEAD_SHA"
          printf '::stop-commands::%s\n' "$(cat /proc/sys/kernel/random/uuid)"
          candidate_home=$(mktemp -d)
          env -i PATH="$PATH" HOME="$candidate_home" bash -euo pipefail -c '
            python -I -m build
            python scripts/audit_publication.py --packages dist
          '

  gate:
    name: sprint-b00 gate
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify acceptance, native CI, independent audit and Qodo
        run: python3 scripts/sprint_gate.py evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          SPRINT_PULL: ${{ needs.prepare.outputs.pull }}
          SPRINT_HEAD: ${{ needs.prepare.outputs.head }}
          SPRINT_BASE: ${{ needs.prepare.outputs.base }}
          SPRINT_ATTESTATION: ${{ inputs.attestation }}
          SPRINT_COORDINATOR_ID: ${{ vars.SPRINT_B00_COORDINATOR_ID }}
          SPRINT_QODO_BOT_ID: ${{ vars.SPRINT_B00_QODO_BOT_ID }}
          SPRINT_QODO_APP_ID: ${{ vars.SPRINT_B00_QODO_APP_ID }}
          SPRINT_BOOTSTRAP_SHA: ${{ vars.SPRINT_B00_BOOTSTRAP_SHA }}
          SPRINT_PUBLISH: ${{ inputs.publish }}
