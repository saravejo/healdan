name: Verify controller

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install real dependencies
        run: |
          brew install age
          npm install --global @anthropic-ai/sandbox-runtime@0.0.83
          python -m pip install .
      - name: Record dependency versions
        run: |
          python --version
          git --version
          age --version
          node --version
          srt --version
      - name: Run controller and real OS sandbox tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Exercise the sprint gate contract
        run: python -m unittest scripts.test_sprint_gate -v
      - name: Audit public tree
        run: python scripts/audit_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-controller-results
          path: test-results.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/audit_publication.py --packages dist
